<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<meta name="description" content="RailCheck — Indian Railways train search, Tatkal & Advance Reservation calculators, live status, route timetables.">
<title>RailCheck — Indian Railways</title>
<style>
/* =========================================================
   RailCheck — Neon Lime (#B6FF00) + Charcoal Black (#111111)
   Color palette exactly per spec.
   ========================================================= */
:root{
  --bg:#111;
  --surface:#181818;
  --surface2:#222;
  --primary:#B6FF00;
  --primary-hover:#CCFF33;
  --text:#fff;
  --text-muted:#A0A0A0;
  --border:#333;
  --border-focus:#B6FF00;
  --placeholder:#777;

  /* Derived helpers (not from spec, but consistent with palette) */
  --primary-soft:rgba(182,255,0,.10);
  --primary-glow:rgba(182,255,0,.25);
  --danger:#ef4444;
  --warn:#f59e0b;
  --radius:10px;
  --radius-sm:6px;
  --shadow:0 6px 24px rgba(0,0,0,.45);
  --shadow-lime:0 6px 24px rgba(182,255,0,.12);
  color-scheme:dark;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","Noto Sans Devanagari",sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  display:flex;flex-direction:column;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
::selection{background:var(--primary);color:#111}
img{display:block;max-width:100%}

/* Scrollbar */
*{scrollbar-width:thin;scrollbar-color:#444 transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a}

/* ============ HEADER ============ */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(17,17,17,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:1200px;margin:0 auto;
  padding:12px 16px;
  display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-name{
  font-size:18px;font-weight:700;letter-spacing:-.02em;
  color:var(--text);
}
.brand-name b{color:var(--primary)}
.header-clock{
  margin-left:auto;
  font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--text-muted);
  background:var(--surface);
  border:1px solid var(--border);
  padding:6px 12px;border-radius:999px;
  white-space:nowrap;
}
.header-clock .clock-label{color:var(--primary);font-weight:600;margin-right:6px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{
  padding:8px 14px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--text-muted);
  transition:color .15s,background .15s;
  min-height:36px;
}
.nav button:hover{color:var(--text);background:var(--surface)}
.nav button.active{
  color:var(--primary);background:var(--primary-soft);
  box-shadow:inset 0 0 0 1px var(--primary-glow);
}

/* ============ MAIN ============ */
main{
  flex:1 0 auto;
  width:100%;max-width:1200px;margin:0 auto;
  padding:24px 16px 48px;
}
.page{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{text-align:center;padding:32px 8px 20px}
.hero h1{
  font-size:clamp(28px,5vw,44px);
  font-weight:800;letter-spacing:-.03em;
  line-height:1.1;margin-bottom:12px;
}
.hero h1 .accent{color:var(--primary)}
.hero p{color:var(--text-muted);font-size:16px;max-width:560px;margin:0 auto}

/* ============ CARDS ============ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
}
.card-title{
  font-size:13px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-muted);
  margin-bottom:14px;display:flex;align-items:center;gap:8px;
}
.card-title::before{
  content:"";display:inline-block;width:3px;height:14px;
  background:var(--primary);border-radius:2px;
}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr}
.grid-stats{grid-template-columns:repeat(3,1fr)}
@media(min-width:720px){
  .grid-2{grid-template-columns:2fr 1fr}
}
@media(max-width:600px){
  .grid-stats{grid-template-columns:1fr}
}

/* ============ SEARCH CARD ============ */
.search-card{padding:24px}
.search-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:12px;align-items:end;
}
@media(max-width:680px){
  .search-row{grid-template-columns:1fr;gap:8px}
  .swap-wrap{display:flex;justify-content:center;margin:-2px 0}
}
.field{display:flex;flex-direction:column;gap:6px}
.field label{
  font-size:12px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text-muted);
}
.field label .req{color:var(--primary)}
.input-wrap{position:relative}
.input, .select, .date-input{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  padding:12px 14px;border-radius:8px;
  font-size:15px;font-weight:500;
  min-height:44px;
  transition:border-color .15s,box-shadow .15s;
}
.input::placeholder,.date-input::placeholder{color:var(--placeholder)}
.input:focus,.select:focus,.date-input:focus{
  outline:none;
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px var(--primary-soft);
}
.date-input{color-scheme:dark}
.date-input::-webkit-calendar-picker-indicator{
  filter:invert(.7) sepia(1) saturate(5) hue-rotate(40deg);
  cursor:pointer;opacity:.85;
}
.date-input::-webkit-calendar-picker-indicator:hover{opacity:1}

/* Swap button */
.swap-wrap{display:flex;justify-content:center;align-items:end;padding-bottom:2px}
.swap-btn{
  width:44px;height:44px;border-radius:50%;
  background:var(--surface2);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--primary);
  transition:transform .25s ease,background .15s,border-color .15s;
}
.swap-btn:hover{
  transform:rotate(180deg);
  background:var(--primary-soft);
  border-color:var(--primary);
}
.swap-btn svg{width:20px;height:20px}

/* Primary button */
.btn-primary{
  background:var(--primary);
  color:#111;
  font-weight:700;font-size:15px;
  padding:14px 20px;border-radius:8px;
  min-height:44px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,transform .05s,box-shadow .15s;
  box-shadow:var(--shadow-lime);
}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn-secondary{
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  padding:12px 18px;border-radius:8px;
  min-height:44px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:border-color .15s,background .15s,color .15s;
}
.btn-secondary:hover{
  border-color:var(--primary);
  color:var(--primary);
  background:var(--primary-soft);
}
.btn-ghost{
  background:transparent;color:var(--text-muted);
  padding:8px 12px;border-radius:6px;font-size:13px;
  min-height:36px;display:inline-flex;align-items:center;gap:6px;
  transition:color .15s,background .15s;
}
.btn-ghost:hover{color:var(--primary);background:var(--primary-soft)}

.search-actions{
  margin-top:16px;display:flex;gap:10px;align-items:stretch;
}
.train-number-search{
  margin-top:16px;padding-top:16px;border-top:1px dashed var(--border);
  display:flex;gap:10px;align-items:end;flex-wrap:wrap;
}
.train-number-search .label-text{
  font-size:13px;color:var(--text-muted);font-weight:500;
  flex:1 1 100%;margin-bottom:2px;
}
.train-number-search .input{flex:1 1 200px;min-width:140px}
.train-number-search .btn-primary{flex:0 0 auto;width:auto;min-width:90px}

/* ============ AUTOCOMPLETE ============ */
.ac-list{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  max-height:280px;overflow-y:auto;
  z-index:60;box-shadow:var(--shadow);
  display:none;
}
.ac-list.open{display:block}
.ac-item{
  padding:10px 14px;cursor:pointer;
  border-bottom:1px solid #1f1f1f;
  display:flex;align-items:center;gap:10px;
  font-size:14px;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.active{
  background:var(--primary-soft);
}
.ac-code{
  font-weight:700;color:var(--primary);
  font-size:12px;background:var(--surface2);
  padding:3px 8px;border-radius:4px;min-width:48px;text-align:center;
}
.ac-name{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-hindi{color:var(--text-muted);font-size:13px}

/* ============ STATS ============ */
.stat-tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px 16px;text-align:center;
}
.stat-num{
  font-size:26px;font-weight:800;color:var(--primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.stat-label{
  font-size:12px;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.06em;margin-top:4px;
}

/* ============ POPULAR ROUTES ============ */
.routes-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;
}
.route-tile{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px;text-align:left;
  transition:border-color .15s,background .15s,transform .1s;
  display:flex;flex-direction:column;gap:4px;
  min-height:64px;
}
.route-tile:hover{
  border-color:var(--primary);background:var(--primary-soft);
  transform:translateY(-2px);
}
.route-tile .codes{
  font-size:12px;color:var(--primary);font-weight:700;letter-spacing:.04em;
}
.route-tile .label{
  font-size:14px;color:var(--text);font-weight:500;
}

/* ============ SAVED TRIPS ============ */
.saved-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding-right:4px}
.saved-item{
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  display:flex;align-items:center;gap:10px;
  transition:border-color .15s,background .15s;
}
.saved-item:hover{border-color:var(--primary);background:var(--primary-soft);cursor:pointer}
.saved-item .codes{font-weight:700;color:var(--primary);font-size:13px}
.saved-item .meta{color:var(--text-muted);font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saved-item .date{color:var(--text-muted);font-size:12px}
.saved-item .del{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);flex-shrink:0;
}
.saved-item .del:hover{color:var(--danger);background:rgba(239,68,68,.1)}
.empty-state{
  padding:20px;text-align:center;color:var(--text-muted);font-size:13px;
}

/* ============ FILTER PILLS ============ */
.filter-pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:500;
  transition:all .15s;
  min-height:34px;
}
.pill:hover{color:var(--text);border-color:#555}
.pill.active{
  background:var(--primary);color:#111;border-color:var(--primary);font-weight:700;
}

/* ============ TRAIN RESULTS ============ */
.results-info{
  color:var(--text-muted);font-size:13px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.results-info b{color:var(--text)}
.train-list{display:flex;flex-direction:column;gap:10px}
.train-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;padding:16px;
  display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  transition:border-color .15s,background .15s,transform .1s;
  cursor:pointer;text-align:left;width:100%;
}
.train-card:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.train-num{
  font-size:18px;font-weight:800;color:var(--primary);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.train-info-block .name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.train-info-block .meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
.train-info-block .meta .arr{color:var(--primary)}
.train-arrow{color:var(--text-muted);font-size:18px}

.badge{
  display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:#fff;
  background:#555;
}
.badge-RAJ{background:#7c3aed}
.badge-SHT{background:#ea580c}
.badge-DRNT{background:#dc2626}
.badge-VNDB,.badge-VNDS,.badge-VNDM{background:#0d9488}
.badge-SUF{background:#0284c7}
.badge-MEX{background:#475569}
.badge-PAS{background:#92400e}
.badge-MEMU,.badge-DMU,.badge-EMU{background:#15803d}
.badge-TOD{background:#be185d}
.badge-TEJ{background:#6d28d9}
.badge-JSH{background:#d97706}
.badge-GBR{background:#059669}
.badge-PEXP{background:#525252}
.badge-TRST{background:#e11d48}
.badge-AMTB{background:#0d9488}
.badge-SUB{background:#475569}

@media(max-width:620px){
  .train-card{grid-template-columns:1fr;gap:8px}
  .train-arrow{display:none}
}

/* ============ TRAIN DETAILS PAGE ============ */
.td-header{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px;
}
.td-title{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;
}
.td-name{font-size:22px;font-weight:800;letter-spacing:-.01em}
.td-num{color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}
.td-route{color:var(--text-muted);font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.td-route .arr{color:var(--primary);font-weight:700}
.td-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--text-muted)}
.td-meta-row b{color:var(--text);font-weight:600}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.info-item{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:12px;
}
.info-item .k{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.info-item .v{font-size:14px;font-weight:600;color:var(--text)}
.info-item .v.accent{color:var(--primary)}

.running-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rd{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;
  background:var(--surface2);color:var(--text-muted);
  border:1px solid var(--border);
}
.rd.on{background:var(--primary);color:#111;border-color:var(--primary)}

/* Booking windows */
.bw-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.bw-grid{grid-template-columns:repeat(3,1fr)}}
.bw-card{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:16px;
  display:flex;flex-direction:column;gap:8px;
}
.bw-card .bw-type{font-size:12px;color:var(--primary);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.bw-card .bw-date{font-size:18px;font-weight:700;color:var(--text)}
.bw-card .bw-time{font-size:13px;color:var(--text-muted)}
.bw-card .bw-countdown{
  background:var(--bg);border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;
  font-variant-numeric:tabular-nums;
  font-size:14px;font-weight:700;color:var(--primary);
  text-align:center;
}
.bw-card .bw-countdown.closed{color:var(--text-muted)}
.bw-card .bw-note{font-size:12px;color:var(--text-muted);line-height:1.4}

/* Booking buttons */
.booking-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.booking-actions .btn-secondary{flex:0 0 auto}
.platform-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-top:12px;
}
.platform-btn{
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:12px;border-radius:8px;
  text-align:center;font-weight:600;font-size:13px;
  transition:border-color .15s,background .15s,color .15s;
  min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.platform-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.platform-btn small{display:block;font-size:10px;color:var(--text-muted);font-weight:500;margin-top:2px}
.platform-btn:hover small{color:var(--primary)}

.expandable{max-height:0;overflow:hidden;transition:max-height .3s ease}
.expandable.open{max-height:600px}
.expandable .inner{padding-top:12px}

/* ============ ROUTE TIMELINE ============ */
.route-timeline{position:relative;padding-left:8px}
.day-divider{
  display:flex;align-items:center;gap:10px;
  margin:18px 0 10px;font-size:13px;font-weight:700;
  color:var(--primary);text-transform:uppercase;letter-spacing:.06em;
}
.day-divider::after{
  content:"";flex:1;height:1px;background:var(--border);
}
.stop-row{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:12px;align-items:start;
  padding:8px 0;position:relative;
}
.stop-dot-col{
  position:relative;width:24px;display:flex;flex-direction:column;align-items:center;
  padding-top:4px;
}
.stop-dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--surface2);border:2px solid var(--border);
  z-index:2;
}
.stop-dot.origin{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.stop-dot.dest{background:var(--warn);border-color:var(--warn);box-shadow:0 0 0 4px rgba(245,158,11,.15)}
.stop-dot.major{background:var(--surface2);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.stop-line{
  position:absolute;top:18px;bottom:-8px;left:50%;transform:translateX(-50%);
  width:2px;background:var(--border);z-index:1;
}
.stop-row:last-child .stop-line{display:none}
.stop-main{display:flex;flex-direction:column;gap:2px;min-width:0;padding-bottom:6px}
.stop-name{font-weight:600;font-size:14px;color:var(--text)}
.stop-name .code{color:var(--primary);font-size:12px;margin-left:6px;font-weight:700}
.stop-hindi{font-size:12px;color:var(--text-muted)}
.stop-times{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stop-time{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.stop-time b{color:var(--text);font-weight:600}
.stop-side{
  text-align:right;font-size:12px;color:var(--text-muted);
  font-variant-numeric:tabular-nums;
  display:flex;flex-direction:column;gap:2px;align-items:flex-end;
}
.stop-side .halt{color:var(--primary);font-weight:600}
.stop-side .day{font-size:11px}

/* ============ FORM (calculators) ============ */
.calc-form{
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}
.calc-form .full{grid-column:1/-1}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* ============ RESULT PANELS ============ */
.result-panel{margin-top:16px;display:none}
.result-panel.show{display:block;animation:fade .2s ease}
.result-row{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:12px 14px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:8px;
}
.result-row .k{font-size:13px;color:var(--text-muted)}
.result-row .v{font-size:14px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.result-row .v.accent{color:var(--primary)}
.result-row .v.big{font-size:18px}
.note-box{
  background:var(--primary-soft);border:1px solid var(--primary);
  border-left:4px solid var(--primary);border-radius:8px;
  padding:12px 14px;margin-top:12px;font-size:13px;color:var(--text);
  line-height:1.5;
}
.error-box{
  background:rgba(239,68,68,.08);border:1px solid var(--danger);
  border-left:4px solid var(--danger);border-radius:8px;
  padding:12px 14px;margin-top:12px;font-size:13px;color:#fca5a5;
  display:none;
}
.error-box.show{display:block}

/* ============ MODAL ============ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;z-index:100;
  padding:16px;
}
.modal-backdrop.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:24px;max-width:480px;width:100%;
  max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow);
}
.modal h3{font-size:18px;font-weight:700;margin-bottom:14px}
.modal .summary{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:14px;margin-bottom:14px;
  font-size:13px;line-height:1.7;
}
.modal .summary .row{display:flex;justify-content:space-between;gap:10px}
.modal .summary .row .k{color:var(--text-muted)}
.modal .summary .row .v{color:var(--text);font-weight:600;text-align:right}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-close{
  position:absolute;top:14px;right:14px;
  width:32px;height:32px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-muted);font-size:20px;
}
.modal-close:hover{color:var(--text);background:var(--surface2)}

/* ============ LIVE PAGE ============ */
.live-card{max-width:560px;margin:0 auto}
.external-note{
  font-size:12px;color:var(--text-muted);margin-top:10px;
  display:flex;align-items:flex-start;gap:6px;
}
.external-note svg{width:14px;height:14px;flex-shrink:0;margin-top:2px}

/* ============ FOOTER ============ */
.site-footer{
  flex-shrink:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:20px 16px;
  text-align:center;color:var(--text-muted);font-size:12px;
}
.site-footer a{color:var(--primary)}

/* ============ LOADING / MISC ============ */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid var(--border);border-top-color:var(--primary);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-state{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:32px;color:var(--text-muted);font-size:14px;
}
.section-gap{margin-top:24px}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;gap:10px;flex-wrap:wrap;
}
.section-head h2{font-size:18px;font-weight:700}
.section-head .sub{font-size:13px;color:var(--text-muted)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.hint{font-size:12px;color:var(--text-muted);margin-top:6px}
</style>
</head>

<script>
"use strict";
/* =========================================================
   RailCheck — single-file vanilla ES6 app
   ========================================================= */

/* ---------- DATA CACHE ---------- */
const cache = {
  stations: null,
  stationMap: null,
  trains: null,
  trainMap: null,
  runningDays: null,
  scheduleValidity: null,
  rules: null,
  metadata: null,
  popularRoutes: null,
  stationIndex: null,
  routes: new Map(),
};

/* ---------- DATA LOADERS ---------- */
async function fetchJSON(path){
  const r = await fetch(path, {cache:'force-cache'});
  if(!r.ok) throw new Error('Failed to load '+path+' ('+r.status+')');
  return r.json();
}
async function loadStations(){
  if(cache.stations) return cache.stations;
  cache.stations = await fetchJSON('./data/stations.json');
  cache.stationMap = new Map();
  for(const s of cache.stations) cache.stationMap.set(s.c, s);
  return cache.stations;
}
async function loadTrains(){
  if(cache.trains) return cache.trains;
  cache.trains = await fetchJSON('./data/trains.json');
  cache.trainMap = new Map();
  for(const t of cache.trains) cache.trainMap.set(t.tn, t);
  return cache.trains;
}
async function loadRunningDays(){
  if(cache.runningDays) return cache.runningDays;
  cache.runningDays = await fetchJSON('./data/running_days.json');
  return cache.runningDays;
}
async function loadScheduleValidity(){
  if(cache.scheduleValidity) return cache.scheduleValidity;
  cache.scheduleValidity = await fetchJSON('./data/schedule_validity.json');
  return cache.scheduleValidity;
}
async function loadRules(){
  if(cache.rules) return cache.rules;
  cache.rules = await fetchJSON('./data/rules.json');
  return cache.rules;
}
async function loadMetadata(){
  if(cache.metadata) return cache.metadata;
  cache.metadata = await fetchJSON('./data/metadata.json');
  return cache.metadata;
}
async function loadPopularRoutes(){
  if(cache.popularRoutes) return cache.popularRoutes;
  cache.popularRoutes = await fetchJSON('./data/popular_routes.json');
  return cache.popularRoutes;
}
async function loadStationIndex(){
  if(cache.stationIndex) return cache.stationIndex;
  cache.stationIndex = await fetchJSON('./data/station_index.json');
  return cache.stationIndex;
}
async function loadRoute(tn){
  if(cache.routes.has(tn)) return cache.routes.get(tn);
  let data;
  try{
    data = await fetchJSON('./data/routes/'+tn+'.json');
  }catch(e){
    data = null;
  }
  cache.routes.set(tn, data);
  return data;
}

/* ---------- DATE UTILITIES (CRITICAL) ---------- */
function pad2(n){ return String(n).padStart(2,'0'); }

function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

// Add days to an ISO date using UTC math (no TZ shift)
function addDaysISO(iso, days){
  if(!iso) return iso;
  const [y,m,d] = iso.split('-').map(Number);
  const ms = Date.UTC(y, m-1, d) + days*86400000;
  const dt = new Date(ms);
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth()+1)}-${pad2(dt.getUTCDate())}`;
}

// ISO -> DD/MM/YYYY
function formatDisplayDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
// ISO -> DD-MM-YYYY (hyphens, for ConfirmTkt/Ixigo)
function formatHyphenDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}-${m}-${y}`;
}
// ISO -> YYYYMMDD (no separators, for RedBus/MMT/Paytm)
function formatCompactDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${y}${m}${d}`;
}
// 24h "HH:MM" -> "HH:MM AM/PM"
function format12h(hhmm){
  if(!hhmm) return '—';
  const [h,m] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if(h12 === 0) h12 = 12;
  return `${pad2(h12)}:${pad2(m)} ${ampm}`;
}
// Live clock: DD/MM/YYYY HH:MM AM/PM (user local TZ)
function formatLiveDateTime(d){
  const dd = pad2(d.getDate());
  const mm = pad2(d.getMonth()+1);
  const yyyy = d.getFullYear();
  let h = d.getHours();
  const min = pad2(d.getMinutes());
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return `${dd}/${mm}/${yyyy} ${pad2(h)}:${min} ${ampm}`;
}
// IST time -> UTC ms. IST = UTC+5:30, so IST HH:MM = UTC (HH-5):(MM-30)
// Use Date.UTC with (h-5, min-30) — handles rollover automatically.
function istTimeToUTCms(isoDate, hhmm){
  const [y,m,d] = isoDate.split('-').map(Number);
  const [h,min] = hhmm.split(':').map(Number);
  return Date.UTC(y, m-1, d, h-5, min-30);
}
function getWeekdayFromISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return days[new Date(Date.UTC(y, m-1, d)).getUTCDay()];
}

/* ---------- DATE-FIX FUNCTIONS (CRITICAL) ---------- */
function getDayOffset(route, boardingCode){
  if(!route || !route.length || !boardingCode) return 0;
  var originDay = route[0].dy || 1;
  for(var i=0; i<route.length; i++){
    if(route[i].c === boardingCode) return (route[i].dy || 1) - originDay;
  }
  return 0;
}
function getOriginatingDate(passengerDate, dayOffset){
  if(!dayOffset || dayOffset === 0) return passengerDate;
  return addDaysISO(passengerDate, -dayOffset);
}

/* ---------- COUNTDOWN ---------- */
function formatCountdown(ms){
  if(ms <= 0) return 'Open now';
  const s = Math.floor(ms/1000);
  const days = Math.floor(s/86400);
  const h = Math.floor((s%86400)/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(days > 0) return `${days}d ${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
  return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
}

const app = document.getElementById('app');

function parseHash(){
  let h = location.hash.replace(/^#/,'');
  if(!h) h = '/home';
  if(h[0] !== '/') h = '/'+h;
  const [path, qs] = h.split('?');
  const params = {};
  if(qs){
    for(const pair of qs.split('&')){
      const [k,v] = pair.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    }
  }
  return { path, params };
}

function setNavActive(path){
  const map = {'/home':'nav-home','/tatkal':'nav-tatkal','/reservation':'nav-reservation','/live':'nav-live'};
  for(const id of Object.values(map)){
    document.getElementById(id).classList.toggle('active', false);
  }
  // strip to base route
  const base = path; // e.g. '/home'
  if(map[base]) document.getElementById(map[base]).classList.add('active');
}

async function route(){
  const { path, params } = parseHash();
  setNavActive(path);
  document.querySelectorAll('.ac-list').forEach(n => n.remove()); // cleanup stray autocomplete
  try{
    if(path === '/home') await renderHome(params);
    else if(path === '/train') await renderTrainDetails(params);
    else if(path === '/tatkal') await renderTatkal(params);
    else if(path === '/reservation') await renderReservation(params);
    else if(path === '/live') await renderLive(params);
    else await renderHome(params);
  }catch(e){
    app.innerHTML = `<div class="card"><div class="error-box show">Failed to render: ${escapeHTML(e.message)}</div></div>`;
  }
  window.scrollTo({top:0, behavior:'instant'});
}

window.addEventListener('hashchange', route);

/* =========================================================
   AUTOCOMPLETE COMPONENT
   ========================================================= */
function attachAutocomplete(input, onSelect){
  let listEl = null;
  let items = [];
  let activeIdx = -1;
  let lastQuery = '';

  function ensureList(){
    if(listEl) return;
    listEl = document.createElement('div');
    listEl.className = 'ac-list';
    listEl.setAttribute('role','listbox');
    input.parentNode.appendChild(listEl);
    listEl.addEventListener('mousedown', (e)=>{
      const item = e.target.closest('.ac-item');
      if(!item) return;
      e.preventDefault();
      const idx = Number(item.dataset.idx);
      if(idx >= 0) pick(idx);
    });
  }

  function render(q){
    ensureList();
    items = searchStations(q);
    activeIdx = -1;
    if(!items.length){
      listEl.innerHTML = `<div class="ac-item" style="color:var(--text-muted);cursor:default">No matches</div>`;
      listEl.classList.add('open');
      return;
    }
    listEl.innerHTML = items.map((s,i)=>{
      const code = escapeHTML(s.c);
      const name = escapeHTML(s.n);
      const hindi = s.h ? `<span class="ac-hindi">${escapeHTML(s.h)}</span>` : '';
      return `<div class="ac-item" data-idx="${i}" role="option"><span class="ac-code">${code}</span><span class="ac-name">${name}</span>${hindi}</div>`;
    }).join('');
    listEl.classList.add('open');
  }

  function pick(i){
    const s = items[i];
    if(!s) return;
    input.value = s.n + ' (' + s.c + ')';
    input.dataset.code = s.c;
    input.dataset.name = s.n;
    close();
    if(onSelect) onSelect(s);
  }

  function close(){
    if(listEl){ listEl.classList.remove('open'); listEl.innerHTML=''; }
    activeIdx = -1;
  }

  function setActive(i){
    if(!listEl) return;
    const nodes = listEl.querySelectorAll('.ac-item');
    nodes.forEach(n => n.classList.remove('active'));
    if(i >= 0 && nodes[i]) {
      nodes[i].classList.add('active');
      nodes[i].scrollIntoView({block:'nearest'});
    }
    activeIdx = i;
  }

  input.addEventListener('input', ()=>{
    input.dataset.code = '';
    input.dataset.name = '';
    const q = input.value.trim();
    if(q.length < 1){ close(); return; }
    render(q);
  });
  input.addEventListener('focus', ()=>{
    const q = input.value.trim();
    if(q.length >= 1) render(q);
  });
  input.addEventListener('keydown', (e)=>{
    if(!listEl || !listEl.classList.contains('open')){
      if(e.key === 'ArrowDown' && input.value.trim()){
        render(input.value.trim());
      }
      return;
    }
    if(e.key === 'ArrowDown'){ e.preventDefault(); setActive(Math.min(activeIdx+1, items.length-1)); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); setActive(Math.max(activeIdx-1, 0)); }
    else if(e.key === 'Enter'){ e.preventDefault(); if(activeIdx >= 0) pick(activeIdx); else if(items[0]) pick(0); }
    else if(e.key === 'Escape'){ close(); }
  });
  input.addEventListener('blur', ()=> setTimeout(close, 150));

  return { close };
}

function searchStations(q){
  if(!cache.stations) return [];
  const ql = q.toLowerCase();
  const res = [];
  // exact code match first
  for(const s of cache.stations){
    if(s.c.toLowerCase() === ql){ res.push(s); if(res.length>=1) break; }
  }
  // then prefix code / name (limit)
  let count = res.length;
  for(const s of cache.stations){
    if(count >= 30) break;
    if(res.includes(s)) continue;
    const c = s.c.toLowerCase();
    const n = (s.n || '').toLowerCase();
    const h = (s.h || '').toLowerCase();
    if(c.startsWith(ql) || n.includes(ql) || (h && h.includes(q))){
      res.push(s); count++;
    }
  }
  return res.slice(0, 30);
}

function parseStationInput(input){
  // value like "NAME (CODE)" or just "CODE" or just "NAME"
  const v = (input.value || '').trim();
  if(input.dataset.code && input.dataset.name && v.includes(input.dataset.code)){
    return { code: input.dataset.code, name: input.dataset.name };
  }
  // try "Name (CODE)" pattern
  const m = v.match(/\(([A-Z0-9]{2,6})\)\s*$/i);
  if(m){
    const code = m[1].toUpperCase();
    const s = cache.stationMap && cache.stationMap.get(code);
    return { code, name: s ? s.n : code };
  }
  // bare code
  if(/^[A-Z0-9]{2,6}$/i.test(v)){
    const code = v.toUpperCase();
    const s = cache.stationMap && cache.stationMap.get(code);
    return { code, name: s ? s.n : code };
  }
  return null;
}

/* =========================================================
   SEARCH RESULTS (uses station_index.json)
   ========================================================= */
async function renderSearchResults(from, to, date){
  const container = document.getElementById('searchResults');
  container.style.display = 'block';
  container.innerHTML = `<div class="loading-state"><span class="spinner"></span>Loading station index…</div>`;

  let index;
  try{
    index = await loadStationIndex();
  }catch(e){
    container.innerHTML = `<div class="error-box show">Failed to load station index: ${escapeHTML(e.message)}</div>`;
    return;
  }

  const fromList = index[from.code] || [];
  const toList = index[to.code] || [];
  // build map: train -> { fromSeq, toSeq }
  const fromMap = new Map();
  for(const e of fromList){
    if(!fromMap.has(e.t)) fromMap.set(e.t, e.s);
    else fromMap.set(e.t, Math.min(fromMap.get(e.t), e.s));
  }
  const toMap = new Map();
  for(const e of toList){
    if(!toMap.has(e.t)) toMap.set(e.t, e.s);
    else toMap.set(e.t, Math.max(toMap.get(e.t), e.s));
  }
  const matches = [];
  for(const [tn, fs] of fromMap){
    const ts = toMap.get(tn);
    if(ts === undefined) continue;
    if(fs < ts) matches.push({ tn, fromSeq: fs, toSeq: ts });
  }
  matches.sort((a,b)=> a.fromSeq - b.fromSeq || a.toSeq - b.toSeq);

  // get train objects
  await loadTrains();
  const trains = matches.map(m => cache.trainMap.get(m.tn)).filter(Boolean);

  // default min date as today
  container.innerHTML = `
    <div class="card">
      <div class="section-head">
        <h2>Trains: ${escapeHTML(from.name)} (${escapeHTML(from.code)}) → ${escapeHTML(to.name)} (${escapeHTML(to.code)})</h2>
        <span class="sub">${formatDisplayDate(date)}</span>
      </div>
      <div class="results-info">
        <div><b>${trains.length}</b> train${trains.length===1?'':'s'} found</div>
      </div>
      <div class="filter-pills" id="filterPills"></div>
      <div class="train-list" id="trainList" style="margin-top:14px"></div>
    </div>
  `;

  // build filter pills
  const typeCounts = {};
  for(const t of trains){
    const f = (TRAIN_TYPES[t.tt] && TRAIN_TYPES[t.tt].filter) || 'Other';
    typeCounts[f] = (typeCounts[f]||0) + 1;
  }
  const pills = [['All', trains.length]].concat(Object.entries(typeCounts).sort((a,b)=> b[1]-a[1]));
  const fp = document.getElementById('filterPills');
  fp.innerHTML = pills.map(([k,v],i)=>`<button class="pill ${i===0?'active':''}" data-filter="${escapeHTML(k)}">${escapeHTML(k)} <span style="opacity:.6">${v}</span></button>`).join('');
  let currentFilter = 'All';
  fp.addEventListener('click', (e)=>{
    const p = e.target.closest('.pill');
    if(!p) return;
    fp.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    currentFilter = p.dataset.filter;
    drawTrains();
  });

  function drawTrains(){
    const list = document.getElementById('trainList');
    const filtered = trains.filter(t => {
      if(currentFilter === 'All') return true;
      const f = (TRAIN_TYPES[t.tt] && TRAIN_TYPES[t.tt].filter) || 'Other';
      return f === currentFilter;
    });
    if(!filtered.length){
      list.innerHTML = `<div class="empty-state">No trains match this filter.</div>`;
      return;
    }
    list.innerHTML = filtered.map(t => `
      <button class="train-card" data-tn="${escapeHTML(t.tn)}" type="button">
        <div class="train-num">${escapeHTML(t.tn)}</div>
        <div class="train-info-block">
          <div class="name">${escapeHTML(t.nm)}</div>
          <div class="meta">
            <span class="badge badge-${escapeHTML(t.tt)}">${escapeHTML(typeLabel(t.tt))}</span>
            <span>${escapeHTML(t.sn)} (${escapeHTML(t.s)})</span>
            <span class="arr">→</span>
            <span>${escapeHTML(t.dn)} (${escapeHTML(t.d)})</span>
            <span>Travel ${escapeHTML(t.tt2||'—')}</span>
          </div>
        </div>
        <div class="train-arrow" aria-hidden="true">›</div>
      </button>
    `).join('');
    list.querySelectorAll('.train-card').forEach(c=>{
      c.addEventListener('click', ()=>{
        const tn = c.dataset.tn;
        location.hash = `#/train?tn=${encodeURIComponent(tn)}&from=${encodeURIComponent(from.code)}&to=${encodeURIComponent(to.code)}&date=${encodeURIComponent(date)}`;
      });
    });
  }
  drawTrains();
}

function renderRouteTimeline(route, fromCode, toCode){
  let html = '';
  let curDay = 0;
  for(let i=0; i<route.length; i++){
    const s = route[i];
    const day = s.dy || 1;
    if(day !== curDay){
      curDay = day;
      html += `<div class="day-divider">Day ${day}</div>`;
    }
    const isOrigin = i === 0;
    const isDest = i === route.length - 1;
    const isMajor = !isOrigin && !isDest && (s.hl || 0) >= 15;
    const isBoard = s.c === fromCode;
    const isAlight = s.c === toCode;
    let dotClass = 'stop-dot';
    if(isOrigin) dotClass += ' origin';
    else if(isDest) dotClass += ' dest';
    else if(isMajor) dotClass += ' major';
    const arr = s.a ? format12h(s.a) : '—';
    const dep = s.d ? format12h(s.d) : '—';
    const halt = s.hl ? (s.hl + 'm') : (isOrigin || isDest ? '—' : '0m');
    const dist = s.ds !== undefined ? s.ds + ' km' : '';
    const hindi = s.h ? `<div class="stop-hindi">${escapeHTML(s.h)}</div>` : '';
    const highlight = (isBoard || isAlight) ? `style="background:var(--primary-soft);border-radius:8px;margin:-4px -8px;padding:4px 8px"` : '';
    html += `
      <div class="stop-row" ${highlight}>
        <div class="stop-dot-col">
          <div class="${dotClass}"></div>
          <div class="stop-line"></div>
        </div>
        <div class="stop-main">
          <div class="stop-name">${escapeHTML(s.n)}<span class="code">${escapeHTML(s.c)}</span>${isBoard?'<span class="badge" style="background:var(--primary);color:#111;margin-left:6px;font-size:10px">BOARD</span>':''}${isAlight?'<span class="badge" style="background:var(--warn);color:#111;margin-left:6px;font-size:10px">ALIGHT</span>':''}</div>
          ${hindi}
          <div class="stop-times">
            <span class="stop-time">Arr <b>${arr}</b></span>
            <span class="stop-time">Dep <b>${dep}</b></span>
          </div>
        </div>
        <div class="stop-side">
          <div class="halt">${halt}</div>
          <div>${dist}</div>
          <div class="day">Day ${day}</div>
        </div>
      </div>
    `;
  }
  return `<div class="route-timeline">${html}</div>`;
}

    </div>
  `;
  document.getElementById('copySummary').addEventListener('click', async (e)=>{
    const btn = e.currentTarget;
    try{
      await navigator.clipboard.writeText(summaryText);
      const orig = btn.textContent;
      btn.textContent = '✓ Copied!';
      setTimeout(()=>{ btn.textContent = orig; }, 1500);
    }catch(err){
      // fallback

    const date = document.getElementById('tk-date').value;
    const board = parseStationInput(boardInput);
    const cls = document.getElementById('tk-class').value;

    if(!/^\d{3,6}$/.test(tn)){ errBox.textContent = 'Enter a valid train number (3-6 digits).'; errBox.classList.add('show'); return; }
    if(!date){ errBox.textContent = 'Select journey date.'; errBox.classList.add('show'); return; }
    if(!board){ errBox.textContent = 'Select a valid boarding station from suggestions.'; errBox.classList.add('show'); return; }

    const train = cache.trainMap.get(tn) || cache.trainMap.get(tn.padStart(5,'0'));
    if(!train){ errBox.textContent = `Train ${tn} not found in dataset.`; errBox.classList.add('show'); return; }

    result.classList.add('show');
    result.innerHTML = `<div class="loading-state"><span class="spinner"></span>Loading route for ${escapeHTML(train.tn)}…</div>`;
    if(tkTimer){ clearInterval(tkTimer); tkTimer = null; }

    let route;
    try{ route = await loadRoute(train.tn); }
    catch(e){ route = null; }
    if(!route){
      result.innerHTML = `<div class="error-box show">Route data not available for train ${escapeHTML(train.tn)}.</div>`;
      return;
    }

    const dayOffset = getDayOffset(route, board.code);
    if(dayOffset < 0){
      result.innerHTML = `<div class="error-box show">Boarding station ${escapeHTML(board.code)} not found on this train's route.</div>`;
      return;
    }
    const originatingDate = getOriginatingDate(date, dayOffset);
    const tatkalDate = addDaysISO(originatingDate, -1);

    const rules = cache.rules;
    const isAC = rules.tatkal.ac_classes.includes(cls);
    const openingTime = isAC ? rules.tatkal.ac_classes_opening_time : rules.tatkal.non_ac_classes_opening_time;
    const targetUTC = istTimeToUTCms(tatkalDate, openingTime);

    // Validate: train runs on originating date
    const rd = cache.runningDays ? cache.runningDays : await loadRunningDays();
    const days = rd[train.tn] || [];
    const weekday = getWeekdayFromISO(originatingDate);
    const runsOnOrigin = days.length === 0 || days.includes(weekday);

    const clsTypeLabel = isAC ? 'AC class' : 'Non-AC class';

    result.innerHTML = `
      <div class="result-row"><span class="k">Passenger journey date</span><span class="v">${formatDisplayDate(date)}</span></div>
      <div class="result-row"><span class="k">Train originating date</span><span class="v accent">${formatDisplayDate(originatingDate)}</span></div>
      <div class="result-row"><span class="k">Tatkal booking date</span><span class="v big accent">${formatDisplayDate(tatkalDate)}</span></div>
      <div class="result-row"><span class="k">Class</span><span class="v">${escapeHTML(cls)} (${escapeHTML(clsTypeLabel)})</span></div>
      <div class="result-row"><span class="k">Booking opens at</span><span class="v big">${format12h(openingTime)} IST</span></div>
      <div class="result-row"><span class="k">Countdown</span><span class="v big accent" id="tk-countdown" data-utc="${targetUTC}">${formatCountdown(targetUTC - Date.now())}</span></div>
      ${dayOffset > 0 ? `<div class="note-box">Boarding at <b>${escapeHTML(board.code)}</b> is Day ${1 + dayOffset} — train originated ${dayOffset} day${dayOffset===1?'':'s'} earlier.</div>` : ''}
      ${!runsOnOrigin ? `<div class="note-box" style="border-color:var(--warn);background:rgba(245,158,11,.08);color:#fcd34d">⚠ Train does not run on ${weekday}, ${formatDisplayDate(originatingDate)} (originating date). Check running days.</div>` : `<div class="note-box">✓ Train runs on ${weekday}. You can book Tatkal on ${formatDisplayDate(tatkalDate)} at ${format12h(openingTime)} IST.</div>`}
    `;

    const cd = document.getElementById('tk-countdown');
    function tick(){
      const diff = Number(cd.dataset.utc) - Date.now();
      if(diff <= 0){ cd.textContent = 'OPEN NOW'; cd.style.color = 'var(--primary)'; }
      else cd.textContent = formatCountdown(diff);
    }
    tick();
    if(tkTimer) clearInterval(tkTimer);
    tkTimer = setInterval(tick, 1000);
  }
}

      <div style="margin-bottom:14px"><a class="btn-ghost" href="#/home">← Back to Home</a></div>

          </div>

    else { boardInput.value = params.from; boardInput.dataset.code = params.from; boardInput.dataset.name = params.from; }
  }

  document.getElementById('ar-calc').addEventListener('click', calcARP);
  document.getElementById('ar-reset').addEventListener('click', ()=>{
    document.getElementById('ar-tn').value = '';
    document.getElementById('ar-date').value = todayISO();
    boardInput.value = ''; boardInput.dataset.code = ''; boardInput.dataset.name = '';
    document.getElementById('ar-result').classList.remove('show');
    document.getElementById('ar-error').classList.remove('show');
  });
  if(params.tn && params.from && params.date){
    setTimeout(()=> calcARP(), 50);
  }

  let arTimer = null;
  async function calcARP(){
    const errBox = document.getElementById('ar-error');
    const result = document.getElementById('ar-result');
    errBox.classList.remove('show');
    const tn = document.getElementById('ar-tn').value.trim();
    const date = document.getElementById('ar-date').value;
    const board = parseStationInput(boardInput);

    if(!/^\d{3,6}$/.test(tn)){ errBox.textContent = 'Enter a valid train number (3-6 digits).'; errBox.classList.add('show'); return; }
    if(!date){ errBox.textContent = 'Select journey date.'; errBox.classList.add('show'); return; }
    if(!board){ errBox.textContent = 'Select a valid boarding station from suggestions.'; errBox.classList.add('show'); return; }

    const train = cache.trainMap.get(tn) || cache.trainMap.get(tn.padStart(5,'0'));
    if(!train){ errBox.textContent = `Train ${tn} not found in dataset.`; errBox.classList.add('show'); return; }

    result.classList.add('show');
    result.innerHTML = `<div class="loading-state"><span class="spinner"></span>Loading route for ${escapeHTML(train.tn)}…</div>`;
    if(arTimer){ clearInterval(arTimer); arTimer = null; }

    try{ route = await loadRoute(train.tn); }
    catch(e){ route = null; }
    if(!route){
      result.innerHTML = `<div class="error-box show">Route data not available for train ${escapeHTML(train.tn)}.</div>`;
      return;
    }

    const dayOffset = getDayOffset(route, board.code);
    if(dayOffset < 0){
      result.innerHTML = `<div class="error-box show">Boarding station ${escapeHTML(board.code)} not found on this train's route.</div>`;
      return;
    }
    const originatingDate = getOriginatingDate(date, dayOffset);
    const rules = cache.rules;
    const arpDays = rules.advance_reservation_period_days;
    const arpDate = addDaysISO(originatingDate, -arpDays);
    const openingTime = rules.advance_reservation_opening_time;
    const targetUTC = istTimeToUTCms(arpDate, openingTime);

    result.innerHTML = `
      <div class="result-row"><span class="k">Passenger journey date</span><span class="v">${formatDisplayDate(date)}</span></div>
      <div class="result-row"><span class="k">Train originating date</span><span class="v accent">${formatDisplayDate(originatingDate)}</span></div>
      <div class="result-row"><span class="k">ARP date (booking opens)</span><span class="v big accent">${formatDisplayDate(arpDate)}</span></div>
      <div class="result-row"><span class="k">ARP</span><span class="v">${arpDays} days</span></div>
      <div class="result-row"><span class="k">Booking opens at</span><span class="v big">${format12h(openingTime)} IST</span></div>
      <div class="result-row"><span class="k">Countdown</span><span class="v big accent" id="ar-countdown" data-utc="${targetUTC}">${formatCountdown(targetUTC - Date.now())}</span></div>

    const cd = document.getElementById('ar-countdown');
    function tick(){
      const diff = Number(cd.dataset.utc) - Date.now();
      if(diff <= 0){ cd.textContent = 'OPEN NOW'; cd.style.color = 'var(--primary)'; }
      else cd.textContent = formatCountdown(diff);
    }
    tick();
    if(arTimer) clearInterval(arTimer);
    arTimer = setInterval(tick, 1000);
  }
}

/* ---------- HELPERS ---------- */
function escapeHTML(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
